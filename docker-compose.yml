# 사내 서버에 올리는 가장 간단한 방법
#   git clone <저장소> && cd onference
#   docker compose up -d --build
#   → http://<서버주소>:8080
services:
  onference:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: onference:latest
    container_name: onference
    restart: unless-stopped
    ports:
      - "8080:80"

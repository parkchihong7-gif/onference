# GitHub Pages 배포 (서버가 따로 없을 때 쓰는 선택지)
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 지정한 뒤 이 워크플로를 실행하면
# https://<계정>.github.io/onference/ 주소가 생성된다.
# ※ 비공개 저장소의 Pages 는 유료 플랜(Pro/Team 이상)에서만 공개된다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/epic-wright-ljo0j2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
